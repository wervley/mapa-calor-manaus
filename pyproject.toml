[project]
name = "mapa-calor-solar-manaus"
version = "1.0.0"
description = "Mapeamento de ilhas de calor urbanas em Manaus com indicador de potencial fotovoltaico"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Wervley Bandeira" }]
keywords = ["manaus", "amazonas", "heat-island", "solar-energy", "geojson", "leaflet"]
dependencies = [
    "requests>=2.31.0",
    "pandas>=2.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
